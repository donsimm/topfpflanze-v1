[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topfpflanze"
version = "0.2.0"
description = "Desktop-Pflanzen, die durch Klicks und Tastaturanschläge wachsen"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.5",
    "spylls>=0.1.7",                      # Rechtschreibprüfung (Hunspell in Python)
    "pynput>=1.7; sys_platform != 'linux'",
]

[project.optional-dependencies]
# Linux: Tastaturzählung unter X11 und Wayland (Benutzer in Gruppe 'input')
linux-keys = ["evdev>=1.6", "pynput>=1.7"]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.gui-scripts]
topfpflanze = "topfpflanze.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topfpflanze = ["dictionaries/*/*", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
