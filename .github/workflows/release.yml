name: Release
# Baut eigenständige Programme (ohne Python-Installation) für Windows, macOS und Linux.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-latest, name: macos}
          - {os: ubuntu-latest, name: linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Systembibliotheken (Linux, für den Ton)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: Installieren
        shell: bash
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.name }}" = linux ]; then
            pip install pynput
            pip install evdev || echo "evdev nicht verfügbar, Tastaturzählung nur über pynput"
          fi
      - name: Build
        run: pyinstaller --noconfirm --windowed --name Topfpflanze --paths src src/topfpflanze/__main__.py
      - name: Packen
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then 7z a ../Topfpflanze-windows.zip Topfpflanze
          elif [ "${{ matrix.name }}" = macos ]; then zip -r ../Topfpflanze-macos.zip Topfpflanze.app
          else tar czf ../Topfpflanze-linux.tar.gz Topfpflanze; fi
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}", path: "Topfpflanze-*"}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: "Topfpflanze-*"
          generate_release_notes: true
          body: |
            Eigenständige Programme, keine Python-Installation nötig. Spielstand bleibt beim Update erhalten.

            - **Windows:** ZIP entpacken, `Topfpflanze.exe` starten. SmartScreen: «Weitere Informationen → Trotzdem ausführen» (nicht signiert).
            - **macOS:** ZIP entpacken, App per Rechtsklick → Öffnen starten (nicht signiert). Systemeinstellungen → Datenschutz → «Eingabeüberwachung» für die Tastaturzählung freigeben.
            - **Linux:** `tar xzf Topfpflanze-linux.tar.gz && ./Topfpflanze/Topfpflanze`. Benötigt `libxcb-cursor0` (`sudo apt install libxcb-cursor0`); für Wayland Benutzer in Gruppe `input`.
