name: Release
# Baut eigenständige Programme (ohne Python-Installation) für Windows, macOS und Linux.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, name: windows, icon: topfpflanze.ico}
          - {os: macos-latest, name: macos-arm, icon: topfpflanze.icns}      # Apple Silicon (M1 und neuer)
          - {os: macos-15-intel, name: macos-intel, icon: topfpflanze.icns}  # Intel-Macs (ältere Modelle)
          - {os: ubuntu-latest, name: linux, icon: topfpflanze.png}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Systembibliotheken (Linux, für den Ton)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: Installieren
        shell: bash
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.name }}" = linux ]; then
            pip install pynput
            pip install evdev || echo "evdev nicht verfügbar, Tastaturzählung nur über pynput"
          fi
      - name: Build
        run: pyinstaller --noconfirm --windowed --name Topfpflanze --paths src --collect-data topfpflanze --icon src/topfpflanze/icons/${{ matrix.icon }} src/topfpflanze/__main__.py
      - name: Packen
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then 7z a ../Topfpflanze-windows.zip Topfpflanze
          # macOS: ditto statt zip, damit die Symlinks im App-Paket erhalten bleiben (sonst startet die App nicht)
          elif [ "${{ matrix.name }}" = macos-arm ]; then ditto -c -k --sequesterRsrc --keepParent Topfpflanze.app ../Topfpflanze-macos-apple-silicon.zip
          elif [ "${{ matrix.name }}" = macos-intel ]; then ditto -c -k --sequesterRsrc --keepParent Topfpflanze.app ../Topfpflanze-macos-intel.zip
          else tar czf ../Topfpflanze-linux.tar.gz Topfpflanze; fi
      - name: Rauchtest (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Das gepackte Programm entpacken und kurz starten (ohne Bildschirm): ein Absturz beim Start lässt den Bau scheitern
          rm -rf /tmp/smoke && mkdir /tmp/smoke
          ditto -x -k Topfpflanze-macos-*.zip /tmp/smoke
          QT_QPA_PLATFORM=offscreen /tmp/smoke/Topfpflanze.app/Contents/MacOS/Topfpflanze --data-dir /tmp/smoke-data > /tmp/smoke.log 2>&1 &
          pid=$!
          sleep 12
          if kill -0 $pid 2>/dev/null; then echo "Programm läuft"; kill $pid
          else echo "Programm ist beim Start abgestürzt:"; cat /tmp/smoke.log; wait $pid || true; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}", path: "Topfpflanze-*"}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: "Topfpflanze-*"
          generate_release_notes: true
          body: |
            Eigenständige Programme, keine Python-Installation nötig. Spielstand bleibt beim Update erhalten.

            - **Windows:** ZIP entpacken, `Topfpflanze.exe` starten. SmartScreen: «Weitere Informationen → Trotzdem ausführen» (nicht signiert).
            - **macOS:** `Topfpflanze-macos-apple-silicon.zip` für Macs mit M1 oder neuer, `Topfpflanze-macos-intel.zip` für ältere Macs mit Intel-Prozessor (Apple-Menü → «Über diesen Mac» zeigt den Chip). ZIP entpacken, App per Rechtsklick → Öffnen starten (nicht signiert). Systemeinstellungen → Datenschutz → «Eingabeüberwachung» für die Tastaturzählung freigeben.
            - **Linux:** `tar xzf Topfpflanze-linux.tar.gz && ./Topfpflanze/Topfpflanze`. Benötigt `libxcb-cursor0` (`sudo apt install libxcb-cursor0`); für Wayland Benutzer in Gruppe `input`.
